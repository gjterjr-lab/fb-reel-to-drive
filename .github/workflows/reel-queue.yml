name: Reel queue

# How the 10 minute rhythm works:
# GitHub's own timer is unreliable (gaps of 30 to 80 minutes), so one job stays
# alive for about 5 hours 20 minutes and loops by itself: one pass over the
# queue, wait 10 minutes, repeat. At the end it starts the next job.
# The hourly schedule is only a safety net that restarts the loop if the chain
# ever breaks. Runs never overlap (see concurrency).

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: reel-queue
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GitHub's Ubuntu mirrors sometimes fail to resolve (DNS) and apt then hangs
      # for an hour. So: hard time limits, and a fallback ffmpeg from PyPI.
      # This step can never block or fail the job.
      - name: Install ffmpeg
        timeout-minutes: 8
        continue-on-error: true
        run: |
          command -v ffmpeg >/dev/null && exit 0
          sudo timeout 120 apt-get update -qq || true
          sudo timeout 240 apt-get install -y -qq ffmpeg || true
          command -v ffmpeg >/dev/null && exit 0
          pip install -q imageio-ffmpeg
          sudo ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          ffmpeg -version | head -1

      - name: Install Python packages (always newest yt-dlp)
        run: |
          pip install -q -r requirements.txt
          pip install -q -U yt-dlp

      - name: Loop over the queue (about 5h20m)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
        run: python -m reelbot.main --loop

      # Only runs if the loop ended normally. A failed loop does NOT restart
      # itself, so a broken setup cannot spin forever; the hourly schedule retries.
      - name: Start the next loop
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run reel-queue.yml --ref "${{ github.ref_name }}"

      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable reel-queue.yml || true
