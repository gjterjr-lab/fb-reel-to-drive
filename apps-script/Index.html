<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px 16px; max-width: 560px; margin-inline: auto; }
    h1 { font-size: 1.3rem; margin: 0 0 16px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; min-width: 0; padding: 12px; font-size: 1rem; border: 1px solid #8885; border-radius: 8px; background: transparent; color: inherit; }
    button { padding: 12px 18px; font-size: 1rem; border: 0; border-radius: 8px; background: #1877f2; color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; }
    #msg { margin: 14px 0; min-height: 1.4em; }
    .ok { color: #1a8f3c; } .warn { color: #c77700; } .bad { color: #d33; }
    #stats { opacity: .75; font-size: .95rem; }
  </style>
</head>
<body>
  <h1>Facebook reel queue</h1>
  <form id="f">
    <input id="link" type="text" placeholder="Paste reel link here" autocomplete="off" autofocus>
    <button id="btn" type="submit">Add</button>
  </form>
  <div id="msg"></div>
  <div id="stats">Loading...</div>

  <script>
    const msg = document.getElementById('msg');
    const stats = document.getElementById('stats');
    const input = document.getElementById('link');
    const btn = document.getElementById('btn');

    function showStats(s) {
      stats.textContent = 'Waiting in queue: ' + s.queue + '  |  Failed (will retry): ' + s.failed;
    }
    function say(text, cls) { msg.className = cls; msg.textContent = text; }

    google.script.run.withSuccessHandler(showStats).getStatus();

    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(function (r) {
          btn.disabled = false;
          if (r.added) { say('Added ✓', 'ok'); input.value = ''; }
          else if (r.duplicate) say('Already in the list.', 'warn');
          else say('That does not look like a Facebook link.', 'bad');
          showStats(r);
          input.focus();
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          say('Error: ' + err.message, 'bad');
        })
        .addLinks(text);
    });
  </script>
</body>
</html>
